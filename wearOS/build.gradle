plugins {
    id 'com.android.application'
    id 'com.jaredsburrows.license'
    id("org.jetbrains.kotlin.plugin.compose") version "2.4.21"
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    signingConfigs {
        if (keystoreProperties.containsKey('storeFile')) {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }
    namespace = 'com.omelan.cofi.wearos'
    compileSdkVersion 37

    defaultConfig {
        applicationId "com.omelan.cofi"
        minSdk 26
        targetSdk 36
        versionCode 186
        versionName "1.12.11"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary = true
        }

    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig = keystoreProperties.containsKey('storeFile') ?
                    signingConfigs.release : signingConfigs.debug
        }
        debug {
            debuggable true
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_25
        targetCompatibility JavaVersion.VERSION_25
    }
    kotlin {
        jvmToolchain(25)
    }
    buildFeatures {
        compose = true
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

licenseReport {
    generateCsvReport = false
    generateHtmlReport = false
    generateJsonReport = true
    // These options are ignored for Java projects
    copyHtmlReportToAssets = false
    copyHtmlReportToAssets = false
    copyJsonReportToAssets = true
}

dependencies {
    implementation project(path: ':cofi-share')
    implementation platform("androidx.compose:compose-bom:${rootProject.ext.compose_bom_version}")
    androidTestImplementation platform("androidx.compose:compose-bom:${rootProject.ext.compose_bom_version}")

    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'com.google.android.gms:play-services-wearable:20.0.1'
    implementation "androidx.wear:wear-remote-interactions:1.2.0"
    implementation "androidx.wear.compose:compose-material3:${rootProject.ext.wear_compose_version}"
    implementation "androidx.wear.compose:compose-foundation:${rootProject.ext.wear_compose_version}"
    implementation "androidx.wear.compose:compose-navigation:${rootProject.ext.wear_compose_version}"
    implementation("androidx.wear:wear-tooling-preview:1.0.0")
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.runtime:runtime-livedata"
    implementation "com.google.android.horologist:horologist-compose-layout:0.7.15"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0"
    implementation "androidx.wear:wear-input:1.2.0"
    implementation 'androidx.wear:wear:1.4.0'

    androidTestImplementation "androidx.compose.ui:ui-test-junit4"
    debugImplementation "androidx.compose.ui:ui-tooling"
    debugImplementation "androidx.compose.ui:ui-test-manifest"
    androidTestImplementation 'androidx.test:core:1.7.0'
}
