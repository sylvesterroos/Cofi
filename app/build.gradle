plugins {
    id 'com.android.application'
    id 'com.jaredsburrows.license'
    id("org.jetbrains.kotlin.plugin.compose") version "2.4.21"
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    signingConfigs {
        if (keystoreProperties.containsKey('storeFile')) {
            release {
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
                storeFile = rootProject.file(keystoreProperties['storeFile'])
                storePassword = keystoreProperties['storePassword']
            }
        }
    }

    defaultConfig {
        applicationId = "com.omelan.cofi"
        minSdk = 25
        targetSdk = 36
        compileSdk = 37
        versionCode = 188
        versionName = "1.21.11"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        testInstrumentationRunnerArguments = [clearPackageData: 'true']
        manifestPlaceholders = [profileable: false]
    }

    testOptions {
        execution = 'ANDROIDX_TEST_ORCHESTRATOR'
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig = signingConfigs.findByName('release')
        }

        debug {
            debuggable = true
            applicationIdSuffix = ".debug"
            versionNameSuffix = "-debug"
        }

        benchmark {
            signingConfig = signingConfigs.debug
            minifyEnabled = true
            manifestPlaceholders["profileable"] = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            applicationIdSuffix = ".benchmark"
            versionNameSuffix = "-benchmark"
        }
    }

    flavorDimensions.add("version")
    productFlavors {
        playStore {
            dimension = "version"
        }
        full {
            dimension = "version"
            versionCode = android.defaultConfig.versionCode
        }
    }

    buildFeatures {
        compose = true
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }

    kotlin {
        jvmToolchain(25)
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES',
                         'META-INF/LICENSE',
                         'META-INF/LICENSE.txt',
                         'META-INF/license.txt',
                         'META-INF/NOTICE',
                         'META-INF/NOTICE.txt',
                         'META-INF/notice.txt',
                         'META-INF/ASL2.0',
                         'META-INF/AL2.0',
                         'META-INF/LGPL2.1',
                         'META-INF/*.kotlin_module']
        }
    }

    namespace = 'com.omelan.cofi'

}

licenseReport {
    generateCsvReport = false
    generateHtmlReport = false
    generateJsonReport = true
    // These options are ignored for Java projects
    copyHtmlReportToAssets = false
    copyHtmlReportToAssets = false
    copyJsonReportToAssets = true
}

configurations {
    ktlint
}

dependencies {
    implementation project(path: ':cofi-share')
    implementation 'androidx.core:core-ktx:1.19.1'
    ktlint("com.pinterest.ktlint:ktlint-cli:1.8.0") {
        attributes {
            attribute(Bundling.BUNDLING_ATTRIBUTE, getObjects().named(Bundling, Bundling.EXTERNAL))
        }
    }
    implementation platform("androidx.compose:compose-bom:${rootProject.ext.compose_bom_version}")
    androidTestImplementation platform("androidx.compose:compose-bom:${rootProject.ext.compose_bom_version}")

    playStoreImplementation 'com.google.android.gms:play-services-wearable:19.0.0'
    playStoreImplementation "androidx.wear:wear-remote-interactions:1.1.0"
    playStoreImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.10.2'
    playStoreImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-guava:1.10.2'

    // Tooling support (Previews, etc.)
    debugImplementation "androidx.compose.ui:ui-tooling"
    implementation "androidx.compose.ui:ui-tooling-preview"

    // Material Design
    implementation "androidx.compose.material3:material3:1.5.0-rc01"
    implementation "androidx.compose.material3:material3-window-size-class"

    implementation 'androidx.palette:palette-ktx:1.1.0'
    // Navigation
    implementation "androidx.navigation:navigation-compose:2.10.2"

    // Integration with observables
    implementation "androidx.compose.runtime:runtime-livedata"
    // Jetpack Utils
    implementation "androidx.compose.animation:animation-graphics"

    implementation "androidx.activity:activity-compose:1.13.0"

    // UI Tests
    androidTestImplementation "androidx.compose.ui:ui-test-junit4"
    androidTestImplementation 'androidx.test.ext:junit-ktx:1.3.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestUtil 'androidx.test:orchestrator:1.6.1'
}

tasks.register("ktlintCheck", JavaExec) {
    group = "verification"
    description = "Check Kotlin code style."
    classpath = configurations.ktlint
    mainClass = "com.pinterest.ktlint.Main"
    workingDir = rootProject.projectDir
    // see https://pinterest.github.io/ktlint/install/cli/#command-line-usage for more information
    args "app/src/**/*.kt", "cofi-share/src/**/*.kt", "**.kts", "!**/build/**"
}

tasks.named("check") {
    dependsOn tasks.named("ktlintCheck")
}

tasks.register("ktlintFormat", JavaExec) {
    group = "formatting"
    description = "Fix Kotlin code style deviations."
    classpath = configurations.ktlint
    mainClass = "com.pinterest.ktlint.Main"
    jvmArgs "--add-opens=java.base/java.lang=ALL-UNNAMED"
    workingDir = rootProject.projectDir
    // see https://pinterest.github.io/ktlint/install/cli/#command-line-usage for more information
    args "-F", "app/src/**/*.kt", "cofi-share/src/**/*.kt", "**.kts", "!**/build/**"
}

