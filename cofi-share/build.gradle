plugins {
    id 'com.android.library'
    id 'com.google.devtools.ksp'
    id "kotlin-parcelize"
    id("org.jetbrains.kotlin.plugin.compose") version "2.4.21"
}

android {
    namespace = 'com.omelan.cofi.share'
    compileSdk 37

    defaultConfig {
        minSdk 25
        targetSdk 36

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
//            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        benchmark {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_25
        targetCompatibility JavaVersion.VERSION_25
    }
    kotlin {
        jvmToolchain(25)
    }
    buildFeatures { // Enables Jetpack Compose for this module
        compose = true
    }
}

ksp {
    arg(new RoomSchemaArgProvider(new File(projectDir, "schemas")))
}

class RoomSchemaArgProvider implements CommandLineArgumentProvider {

    @InputDirectory
    @PathSensitive(PathSensitivity.RELATIVE)
    File schemaDir

    RoomSchemaArgProvider(File schemaDir) {
        this.schemaDir = schemaDir
    }

    @Override
    Iterable<String> asArguments() {
        return ["room.schemaLocation=${schemaDir.path}".toString()]
    }
}


dependencies {
    implementation platform("androidx.compose:compose-bom:${rootProject.ext.compose_bom_version}")

    api 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.test:core-ktx:1.7.0'
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.material3:material3"
    api "androidx.compose.material:material-icons-core:1.7.8"
    api "androidx.datastore:datastore-preferences:1.3.0"
    //Room

    api "androidx.room:room-runtime:${rootProject.ext.room_version}"
    api 'androidx.test.ext:junit-ktx:1.3.0'
    api "androidx.lifecycle:lifecycle-livedata-ktx:2.11.0"
    implementation 'androidx.work:work-runtime-ktx:2.12.0'
    implementation 'androidx.core:core-ktx:1.19.1'
    ksp "androidx.room:room-compiler:${rootProject.ext.room_version}"
    api "androidx.room:room-ktx:${rootProject.ext.room_version}"
    androidTestImplementation "androidx.room:room-testing:${rootProject.ext.room_version}"
    androidTestImplementation "androidx.arch.core:core-testing:2.2.0"
}
